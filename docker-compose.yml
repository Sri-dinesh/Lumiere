services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumiere_dev
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumiere -d lumiere_dev']
      interval: 5s
      retries: 10
volumes:
  pgdata:
